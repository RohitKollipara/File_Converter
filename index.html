<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FileShift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322D3EE'/%3E%3Cpath d='M9 12h12l-3-3M23 20H11l3 3' stroke='%2304060A' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04060A;--panel:#0A0F16;--panel2:#0E1520;--line:#15202C;--line2:#213245;
  --cy:#22D3EE;--cy2:#06B6D4;--cy3:#67E8F9;--cyd:rgba(34,211,238,.1);--cyb:rgba(34,211,238,.35);
  --t1:#E9F2F8;--t2:#8FA3B5;--t3:#566A7D;--ok:#34D399;--warn:#FBBF24;--err:#F87171;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
html{color-scheme:dark;scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font:14px/1.55 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(34,211,238,.09),transparent 60%),
             radial-gradient(700px 500px at -10% 110%,rgba(6,182,212,.07),transparent 60%),
             linear-gradient(rgba(34,211,238,.022) 1px,transparent 1px) 0 0/44px 44px,
             linear-gradient(90deg,rgba(34,211,238,.022) 1px,transparent 1px) 0 0/44px 44px}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
code{font-family:var(--mono);font-size:.85em;background:var(--panel2);border:1px solid var(--line2);padding:1px 6px;border-radius:5px;color:var(--cy3)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
[hidden]{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh;position:relative;z-index:1}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:2px;background:rgba(6,9,14,.85);backdrop-filter:blur(14px);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 20px;font-size:17px;font-weight:700;letter-spacing:-.4px}
.brand i{font-style:normal;color:var(--cy)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04060A;display:grid;place-items:center;box-shadow:0 0 22px rgba(34,211,238,.4)}
.grp{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--t2);font-weight:500;position:relative;transition:background .15s,color .15s}
.nav:hover{background:var(--panel2);color:var(--t1)}
.nav.on{background:var(--cyd);color:var(--cy3);box-shadow:inset 0 0 0 1px rgba(34,211,238,.22)}
.nav.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--cy);box-shadow:0 0 12px var(--cy)}
.nav .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--warn);display:none}
.nav .dot.on{display:block}
.engine{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:12px;color:var(--t2);transition:border-color .15s}
.engine:hover{border-color:var(--line2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--t3);flex-shrink:0}
.pulse.ok{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pl 2.4s infinite}
.pulse.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.pulse.err{background:var(--err)}
@keyframes pl{50%{opacity:.35}}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:14px;padding:0 32px;background:rgba(4,6,10,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{color:var(--t3);font-size:13px}.crumb b{color:var(--t1);font-weight:600}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;padding:6px 13px;border:1px solid var(--line2);border-radius:99px;font-size:12px;color:var(--t2);background:var(--panel)}
.pill svg{width:14px;height:14px;color:var(--cy)}
.menu{display:none;background:none;border:1px solid var(--line2);border-radius:9px;padding:7px;color:var(--t2)}
.view{width:100%;max-width:1120px;margin:0 auto;padding:36px 32px 80px}
.view>*{animation:up .4s cubic-bezier(.2,.7,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}

/* page header */
.phead{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.pic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--cy);background:var(--cyd);border:1px solid var(--cyb);box-shadow:0 0 30px rgba(34,211,238,.15);flex-shrink:0}
.pic svg{width:24px;height:24px}
.phead h1{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2}
.phead p{color:var(--t2);margin-top:3px;max-width:620px}

/* cards & layout */
.card{background:linear-gradient(180deg,var(--panel),#080C12);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pad{padding:22px}
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:12px}

/* dropzone */
.drop{position:relative;border:1.5px dashed var(--line2);border-radius:16px;padding:38px 20px;text-align:center;background:rgba(34,211,238,.015);transition:all .2s}
.drop:hover,.drop.over{border-color:var(--cy);background:var(--cyd);box-shadow:0 0 0 5px rgba(34,211,238,.06),0 0 40px rgba(34,211,238,.08) inset}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dic{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;color:var(--cy);background:var(--cyd);border:1px solid var(--cyb);transition:transform .25s}
.drop:hover .dic,.drop.over .dic{transform:translateY(-4px) scale(1.05)}
.dic svg{width:26px;height:26px}
.drop b{display:block;font-size:15px}.drop small{display:block;color:var(--t3);margin:3px 0 14px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.chips code{font-size:10.5px}

/* file card / rows */
.fcard{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2)}
.badge{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font:700 10.5px var(--mono);color:#04060A;letter-spacing:.03em;flex-shrink:0}
.fi{flex:1;min-width:0}.fi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.fi small{color:var(--t3)}
.ib{background:none;border:1px solid var(--line2);border-radius:8px;padding:6px;color:var(--t2);display:grid;place-items:center;transition:all .15s}
.ib:hover:not(:disabled){color:var(--cy3);border-color:var(--cy)}.ib.x:hover{color:var(--err);border-color:var(--err)}.ib:disabled{opacity:.3;cursor:default}
.ib svg{width:15px;height:15px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);transition:border-color .15s,opacity .15s}
.row.drag{opacity:.35}.row.over{border-color:var(--cy)}
.grip{color:var(--t3);cursor:grab;letter-spacing:-2px;user-select:none}
.num{font:700 11px var(--mono);color:var(--cy);width:20px}
.rn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.rs{color:var(--t3);font-size:12px}

/* options */
.fld{display:block;margin-bottom:16px}.fld>span{display:block;font-size:12.5px;font-weight:600;color:var(--t2);margin-bottom:7px}
.fld input,.fld select{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.14)}
.fld select{appearance:none}
.hint{font-size:12px;color:var(--t3);margin:-9px 0 16px}
.seg{display:grid;gap:8px;margin-bottom:18px}
.so{text-align:left;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);transition:all .15s}
.so b{display:block;font-size:13.5px;font-weight:600}.so small{color:var(--t3);font-size:12px}
.so:hover{border-color:var(--cyb)}
.so.on{border-color:var(--cy);background:var(--cyd);box-shadow:0 0 22px rgba(34,211,238,.12)}.so.on b{color:var(--cy3)}
.tog{display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer}
.tog input{display:none}.tog i{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;flex-shrink:0;transition:background .2s}
.tog i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--t2);transition:all .2s}
.tog input:checked+i{background:var(--cy2)}.tog input:checked+i::after{left:19px;background:#fff}
.tog b{display:block;font-size:13px;font-weight:600}.tog small{color:var(--t3);font-size:12px}
.tip{color:var(--t2);font-size:13px}.tip li{margin:0 0 9px 18px}.tip li::marker{color:var(--cy)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:10px 18px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;transition:all .15s}
.btn:hover{border-color:var(--cy);color:var(--cy3)}
.btn.pri,.btn.big{background:linear-gradient(135deg,var(--cy),var(--cy2));color:#031014;border:none;box-shadow:0 6px 24px rgba(34,211,238,.28)}
.btn.pri:hover,.btn.big:hover:not(:disabled){color:#031014;transform:translateY(-1px);box-shadow:0 10px 32px rgba(34,211,238,.4)}
.btn.big{width:100%;padding:14px;font-size:14.5px;font-weight:700}
.btn:disabled{background:var(--panel2);color:var(--t3);box-shadow:none;cursor:not-allowed;border:1px solid var(--line)}
.hintline{text-align:center;color:var(--t3);font-size:12px;margin-top:10px;min-height:18px}
.link{background:none;border:none;color:var(--cy);font-weight:600;padding:0}.link:hover{text-decoration:underline}

/* messages / progress / result */
.msg{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:12px;margin-top:14px;font-size:13px}
.msg.err{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.25);color:#FCA5A5}
.msg.warn{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);color:#FCD34D}
.view>.msg{margin:0 0 20px}
#out{margin-top:20px}
.prog{padding:20px 22px}.ptxt{font-weight:600;margin-bottom:12px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--cy2),var(--cy3));box-shadow:0 0 14px var(--cy);transition:width .15s}
.bar i.ind{width:35%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.res{padding:22px}
.rh{display:flex;align-items:center;gap:16px}
.ok{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35);color:var(--ok);flex-shrink:0}
.rh>div:not(.ok){flex:1;min-width:0}.rh b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rh p{color:var(--t2);font-size:13px}
.cmp{margin-top:20px;display:grid;gap:12px}
.cmp div span{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:6px}
.cmp .bar{height:10px}.cmp .bar i{transition:width .9s cubic-bezier(.2,.7,.2,1)}

/* home */
.hero{position:relative;padding:46px 40px;border-radius:24px;border:1px solid var(--line2);overflow:hidden;margin-bottom:22px;
  background:radial-gradient(600px 260px at 90% 0%,rgba(34,211,238,.18),transparent 70%),linear-gradient(180deg,var(--panel),#070B11)}
.hero::after{content:'';position:absolute;right:-60px;bottom:-80px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(34,211,238,.18);box-shadow:0 0 0 40px rgba(34,211,238,.03),0 0 0 90px rgba(34,211,238,.02)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cy);margin-bottom:16px}
.hero h1{font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-1.4px;max-width:640px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--cy3),var(--cy2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--t2);font-size:15.5px;margin:14px 0 26px;max-width:540px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}
.stat{padding:18px 20px}.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.8px}.stat span{color:var(--t3);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 14px}.sec h2{font-size:17px;font-weight:700;letter-spacing:-.3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:34px}
.tcard{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#080C12);transition:all .25s;position:relative;overflow:hidden}
.tcard::before{content:'';position:absolute;inset:0;background:radial-gradient(260px 120px at 0 0,rgba(34,211,238,.12),transparent 70%);opacity:0;transition:opacity .25s}
.tcard:hover{border-color:var(--cyb);transform:translateY(-3px);box-shadow:0 14px 40px rgba(34,211,238,.1)}.tcard:hover::before{opacity:1}
.tcard .pic{width:44px;height:44px;border-radius:12px;position:relative}.tcard h3{font-size:16px;font-weight:700;position:relative}
.tcard p{color:var(--t2);font-size:13px;flex:1;position:relative}.tcard .go{display:flex;align-items:center;gap:6px;color:var(--cy);font-weight:600;font-size:13px;position:relative}
.tcard .go svg{width:15px;height:15px;transition:transform .2s}.tcard:hover .go svg{transform:translateX(4px)}

/* history / system */
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tools select,.tools input{padding:9px 13px;background:var(--panel);border:1px solid var(--line2);border-radius:10px}
.tools input{flex:1;min-width:180px}.tools input:focus,.tools select:focus{outline:none;border-color:var(--cy)}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.hrow:last-child{border:none}.hrow .pic{width:38px;height:38px;border-radius:10px}.hrow .pic svg{width:18px;height:18px}
.tag{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--cyd);color:var(--cy3);border:1px solid rgba(34,211,238,.2)}
.empty{text-align:center;padding:54px 20px;color:var(--t2)}.empty .pic{margin:0 auto 16px}.empty b{display:block;color:var(--t1);font-size:16px;margin-bottom:4px}.empty .btn{margin-top:18px}
.eng{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ecard{padding:20px;display:flex;flex-direction:column;gap:6px}.ecard .eh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.ecard p{color:var(--t2);font-size:13px}.ecard small{color:var(--t3);font-size:12px}
.st{margin-left:auto;font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.st.ok{background:rgba(52,211,153,.1);color:var(--ok);border:1px solid rgba(52,211,153,.3);width:auto;height:auto;display:inline-block}.st.no{background:rgba(251,191,36,.08);color:var(--warn);border:1px solid rgba(251,191,36,.3)}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(720px,100%);max-height:84vh;overflow:auto;padding:26px}.mbox h2{font-size:19px;margin-bottom:4px}
.mrow{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.mrow>code{width:60px;text-align:center}.mrow .chips{justify-content:flex-start}

@media(max-width:980px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.hero h1{font-size:30px}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}.side{position:fixed;z-index:60;width:264px;transform:translateX(-102%);transition:transform .25s;background:#06090E}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}.menu{display:grid}.top,.view{padding-left:18px;padding-right:18px}.hero{padding:30px 22px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <button class="menu" id="menu" aria-label="Menu"></button>
      <div class="crumb">FileShift <span style="margin:0 6px">/</span><b id="crumb">Home</b></div>
      <div class="pill" id="pill"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const ALIAS={jpeg:'jpg',htm:'html'};
const ext=n=>{const e=String(n).split('.').pop().toLowerCase();return ALIAS[e]||e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const dec=s=>s?decodeURIComponent(s):'';
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':new Date(t).toLocaleDateString()};

const ICON={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',swap:'<path d="M7 7h13l-4-4"/><path d="M17 17H4l4 4"/>',
 layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
 scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/>',
 shrink:'<path d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"/>',
 scan:'<path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 8h8M7 12h10M7 16h6"/>',
 lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
 unlock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 017.5-2"/>',

 cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/>',

/* ── networking: XHR for upload progress ── */
const post=(url,form,onp)=>new Promise((res,rej)=>{
 const x=new XMLHttpRequest();x.open('POST',url);x.responseType='blob';
 x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total,false);x.upload.onload=()=>onp(1,true);
 x.onload=async()=>{if(x.status>=200&&x.status<300)return res({blob:x.response,h:n=>x.getResponseHeader(n)});
  let m='Something went wrong.';try{const j=JSON.parse(await x.response.text());m=typeof j.detail==='string'?j.detail:'Please check your input and try again.'}catch{}rej(new Error(m))};
 x.onerror=()=>rej(new Error('Cannot reach the FileShift server. Is it still running?'));x.send(form)});

function dropzone(el,{accept,multi,label,sub,on}){
 const acc=accept.flatMap(e=>e==='jpg'?['.jpg','.jpeg']:e==='html'?['.html','.htm']:['.'+e]).join(',');
 el.innerHTML=`<div class="drop"><input type="file" ${multi?'multiple':''} accept="${acc}"/><div class="dic">${ic('upload')}</div><b>${label}</b><small>${sub}</small><div class="chips">${accept.slice(0,14).map(e=>`<code>.${e}</code>`).join('')}</div></div>`;
 const d=$('.drop',el),inp=$('input',el);
 const take=fl=>{const ok=[],bad=[];[...fl].forEach(f=>accept.includes(ext(f.name))?ok.push(f):bad.push(f.name));on(ok,bad)};
 inp.onchange=()=>{take(inp.files);inp.value=''};
 ['dragenter','dragover'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.add('over')}));
 ['dragleave','drop'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.remove('over')}));
 d.addEventListener('drop',e=>take(e.dataTransfer.files));
}

function runner(el){return{
 busy(){el.innerHTML=`<div class="card prog"><div class="ptxt">Uploading…</div><div class="bar"><i></i></div></div>`},
 prog(p,done){const b=$('.bar i',el),t=$('.ptxt',el);if(!b)return;if(done){b.classList.add('ind');b.style.width='';t.textContent='Working on it — everything stays on your machine…'}else{b.style.width=Math.round(p*100)+'%';t.textContent='Uploading… '+Math.round(p*100)+'%'}},
 ok(r){const pct=r.orig&&r.out?Math.max(2,Math.round(r.out/r.orig*100)):0;
  el.innerHTML=`<div class="card res"><div class="rh"><div class="ok">${ic('check')}</div><div><b>${esc(r.name)}</b><p>${esc(r.note||'Done — your download has started.')}</p></div><a class="btn pri" href="${r.url}" download="${esc(r.name)}">${ic('download')}Download</a></div>
  ${pct?`<div class="cmp"><div><span><b>Before</b>${bytes(r.orig)}</span><div class="bar"><i style="width:100%;background:var(--line2);box-shadow:none"></i></div></div><div><span><b>After</b>${bytes(r.out)} · ${100-pct}% smaller</span><div class="bar"><i id="after" style="width:0"></i></div></div></div>`:''}</div>`;
  if(pct)requestAnimationFrame(()=>setTimeout(()=>{const a=$('#after',el);if(a)a.style.width=pct+'%'},60))},
 err(m){el.innerHTML=`<div class="msg err">${ic('alert')}<div><b>That didn't work.</b> ${esc(m)}</div></div>`},
 clear(){el.innerHTML=''}}}

async function exec(url,form,tool,inName,rn){
 rn.busy();
 try{
  const {blob,h}=await post(url,form,(p,d)=>rn.prog(p,d));
  const name=dec(h('X-Output-Filename'))||'output',note=dec(h('X-Conversion-Note'));
  const href=URL.createObjectURL(blob),id=Date.now()+''+Math.random().toString(36).slice(2,6);
  S.blobs[id]=href;H.add({id,t:Date.now(),tool,inName,outName:name,size:blob.size,note});
  const a=document.createElement('a');a.href=href;a.download=name;a.click();
  rn.ok({name,note,url:href,orig:+h('X-Original-Size')||0,out:+h('X-Output-Size')||0});
 }catch(e){rn.err(e.message)}
}

 `<div class="cols"><div class="col"><div class="card pad"><div id="dz"></div><div id="files"></div><div id="msg"></div></div></div>

  <div class="tools"><input id="q" placeholder="Search by file name…"/><select id="tf"><option value="">All tools</option>${Object.keys(TOOLS).map(k=>`<option value="${k}">${TOOLS[k].title}</option>`).join('')}</select><button class="btn" id="clr">${ic('trash')}Clear history</button></div><div class="card" id="list"></div>`;
 const draw=()=>{const l=H.get().filter(x=>(!tool||x.tool===tool)&&(!q||(x.outName+x.inName).toLowerCase().includes(q)));
  $('#list').innerHTML=l.length?l.map(histRow).join(''):`<div class="empty"><div class="pic">${ic('clock')}</div><b>${H.get().length?'No matches':'No history yet'}</b>${H.get().length?'Try a different search or filter.':'Convert or process a file and it will appear here.'}${H.get().length?'':`<br/><a class="btn pri" href="#/convert">${ic('swap')}Convert a file</a>`}</div>`;
  $('#clr').disabled=!H.get().length};
 $('#q').oninput=e=>{q=e.target.value.toLowerCase();draw()};$('#tf').onchange=e=>{tool=e.target.value;draw()};
 $('#clr').onclick=()=>{if(confirm('Clear all history?')){H.clear();draw()}};draw();
};

PAGES.system=v=>{
 const E=[['libreoffice','LibreOffice','Pixel-accurate PPTX → PDF and reading old .doc / .ppt / .xls files.','Free from libreoffice.org'],
  ['tesseract','Tesseract OCR','Recognises text in scanned PDFs and images.','Windows: UB-Mannheim installer · macOS: brew install tesseract · Linux: apt install tesseract-ocr'],
  ['weasyprint','WeasyPrint','Highest-quality HTML, Markdown and spreadsheet → PDF.','pip install weasyprint (Windows also needs GTK)'],
  ['python-pptx','python-pptx','Reads and writes PowerPoint files.','pip install python-pptx'],['openpyxl','openpyxl','Reads and writes Excel files.','pip install openpyxl'],['Pillow','Pillow','Image conversion and compression.','pip install Pillow']];
 v.innerHTML=`<div class="phead"><div class="pic">${ic('cpu')}</div><div><h1>System</h1><p>The engines FileShift found on this machine. Missing ones only disable the features that need them.</p></div></div>
  <div class="eng">${E.map(([k,n,d,h])=>{const ok=S.caps&&S.caps[k];return `<div class="card ecard"><div class="eh">${n}<span class="st ${ok?'ok':'no'}">${S.caps?(ok?'Ready':'Missing'):'Unknown'}</span></div><p>${d}</p>${ok?'':`<small>${h}</small>`}${k==='tesseract'&&ok&&S.langs.length?`<div class="chips" style="justify-content:flex-start;margin-top:6px">${S.langs.map(l=>`<code>${l}</code>`).join('')}</div>`:''}</div>`}).join('')}</div>
  <div class="sec" style="margin-top:30px"><h2>Developer</h2></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="/docs" target="_blank">Interactive API docs</a><a class="btn" href="/tools" target="_blank">Tool catalogue (JSON)</a><button class="btn" id="re">${ic('refresh')}Re-check engines</button></div>`;
 $('#re').onclick=async()=>{await boot();PAGES.system(v)};
};

/* ── shell, status, router ── */
function drawSide(){
 $('#side').innerHTML=`<a class="brand" href="#/"><span class="logo">${ic('swap')}</span><span>File<i>Shift</i></span></a>`+
  NAV.map(([g,it])=>`<div class="grp">${g}</div>`+it.map(([id,t,i])=>`<a class="nav" data-id="${id}" href="#/${id}">${ic(i)}<span>${t}</span><em class="dot"></em></a>`).join('')).join('')+
  `<a class="engine" href="#/system"><span class="pulse" id="pulse"></span><span id="engT">Checking engines…</span></a>`;
 $('#menu').innerHTML=ic('menu');
 $('#pill').innerHTML=`${ic('shield')} Private · runs locally`;
}
function status(){
 const keys=['libreoffice','weasyprint','tesseract','python-pptx','openpyxl','Pillow'],c=S.caps;
 const p=$('#pulse'),t=$('#engT');
 if(!S.up||!c){p.className='pulse err';t.textContent='Server not reachable';return}
 const miss=keys.filter(k=>!c[k]);
 p.className='pulse '+(miss.length?'warn':'ok');t.textContent=miss.length?`${miss.length} optional engine${miss.length>1?'s':''} missing`:'All engines ready';
 $('.nav[data-id=ocr] .dot').classList.toggle('on',!c.tesseract);$('.nav[data-id=system] .dot').classList.toggle('on',miss.length>0);
}
function route(){
 const id=location.hash.replace(/^#\/?/,'');
 const page=PAGES[id]||PAGES[''],key=PAGES[id]?id:'';
 $$('.nav').forEach(a=>a.classList.toggle('on',a.dataset.id===key));
 const title=key===''?'Home':TOOLS[key]?.title||{history:'History',system:'System'}[key];
 $('#crumb').textContent=title;document.title=`${title} · FileShift`;
 const v=$('#view');v.innerHTML='';page(v);$('#side').classList.remove('open');window.scrollTo(0,0);
}
async function boot(){
 const get=async u=>{try{const r=await fetch(u);if(!r.ok)throw 0;return await r.json()}catch{return null}};
 const [f,c,o]=await Promise.all([get('/formats'),get('/capabilities'),get('/ocr/languages')]);
 S.up=!!f;S.formats=f||{};S.caps=c;S.langs=(o&&o.languages)||[];status();
}
drawSide();
$('#menu').onclick=()=>$('#side').classList.toggle('open');
window.addEventListener('hashchange',route);
boot().then(route);
</script>
</body>
</html>
